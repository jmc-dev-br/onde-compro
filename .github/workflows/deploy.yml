name: Deploy Onde compro? ao Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: onde-compro-pages-production
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Verificar credenciais do Cloudflare
        id: credentials
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deploy ignorado::Cadastre CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID em Settings > Secrets and variables > Actions para publicar automaticamente."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Baixar o código
        if: steps.credentials.outputs.configured == 'true'
        uses: actions/checkout@v4

      - name: Validar protótipo FairBasket
        if: steps.credentials.outputs.configured == 'true'
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path("fairbasket.html").read_text(encoding="utf-8")
          scripts = re.findall(r'<script type="module">(.*?)</script>', html, flags=re.S | re.I)
          if len(scripts) != 1:
              raise SystemExit(f"Expected one FairBasket module script, found {len(scripts)}")
          Path("/tmp/fairbasket-check.mjs").write_text(scripts[0], encoding="utf-8")
          for name in ("search", "chat"):
              source = Path(f"functions/api/{name}.js").read_text(encoding="utf-8")
              Path(f"/tmp/{name}-check.mjs").write_text(source, encoding="utf-8")
          contract = Path("contracts/FairBasketRegistry.sol").read_text(encoding="utf-8")
          if "contract FairBasketRegistry" not in contract or "pragma solidity ^0.8.24;" not in contract:
              raise SystemExit("FairBasketRegistry contract source is missing or malformed")
          print("FairBasket HTML, API functions and contract source were found.")
          PY
          node --check /tmp/fairbasket-check.mjs
          node --check /tmp/search-check.mjs
          node --check /tmp/chat-check.mjs
          node tests/fairbasket-static-test.mjs

      - name: Compilar contrato FairBasket
        if: steps.credentials.outputs.configured == 'true'
        shell: bash
        run: |
          mkdir -p /tmp/fairbasket-solc
          npx --yes solc@0.8.30 --bin --abi contracts/FairBasketRegistry.sol -o /tmp/fairbasket-solc
          echo "FairBasketRegistry compiled successfully."

      - name: Preparar arquivos estáticos
        if: steps.credentials.outputs.configured == 'true'
        shell: bash
        run: |
          mkdir -p dist
          cp index.html dist/index.html
          cp fairbasket.html dist/fairbasket.html
          ABI_FILE="$(find /tmp/fairbasket-solc -type f -name '*FairBasketRegistry.abi' -print -quit)"
          BYTECODE_FILE="$(find /tmp/fairbasket-solc -type f -name '*FairBasketRegistry.bin' -print -quit)"
          if [[ -z "$ABI_FILE" || -z "$BYTECODE_FILE" ]]; then
            echo "Compiled ABI or bytecode for FairBasketRegistry was not found." >&2
            find /tmp/fairbasket-solc -maxdepth 2 -type f -print
            exit 1
          fi
          ABI_FILE="$ABI_FILE" BYTECODE_FILE="$BYTECODE_FILE" node - <<'NODE'
          const fs = require("node:fs");
          const abi = JSON.parse(fs.readFileSync(process.env.ABI_FILE, "utf8"));
          const bytecode = fs.readFileSync(process.env.BYTECODE_FILE, "utf8").trim();
          if (!Array.isArray(abi) || !/^([0-9a-f]+)$/i.test(bytecode) || bytecode.length < 100) {
            throw new Error("Invalid compiled ABI or bytecode.");
          }
          fs.writeFileSync("dist/fairbasket-contract.json", JSON.stringify({
            contractName: "FairBasketRegistry",
            compiler: "solc 0.8.30",
            chainId: 84532,
            abi,
            bytecode: "0x" + bytecode
          }, null, 2) + "\n");
          console.log("Wrote dist/fairbasket-contract.json (" + bytecode.length / 2 + " byte bytecode).");
          NODE
          if [[ -f comunidade.html ]]; then
            cp comunidade.html dist/comunidade.html
          fi
          if [[ -f clube.html ]]; then
            cp clube.html dist/clube.html
          fi
          if [[ -f afiliados.html ]]; then
            cp afiliados.html dist/afiliados.html
          fi
          if [[ -d assets ]]; then
            mkdir -p dist/assets
            cp -R assets/. dist/assets/
          fi

      - name: Publicar no Cloudflare Pages
        id: deploy_pages
        if: steps.credentials.outputs.configured == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=onde-compro --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Smoke-test deployed FairBasket assets
        if: steps.credentials.outputs.configured == 'true'
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy_pages.outputs.deployment-url }}
          ALIAS_URL: ${{ steps.deploy_pages.outputs.pages-deployment-alias-url }}
        run: |
          set -euo pipefail
          BASE_URL="$DEPLOYMENT_URL"
          if [[ -z "$BASE_URL" ]]; then BASE_URL="https://onde-compro.pages.dev"; fi
          READY=false
          for attempt in $(seq 1 4); do
            echo "Checking the immutable deployed URL (attempt $attempt/12): $BASE_URL"
            if curl --connect-timeout 5 --max-time 10 --fail --silent --show-error "$BASE_URL/fairbasket.html" -o /tmp/published-fairbasket.html && grep -q "Spend wisely." /tmp/published-fairbasket.html && grep -q "Deploy test registry" /tmp/published-fairbasket.html && grep -q "Load simulated walkthrough" /tmp/published-fairbasket.html && curl --connect-timeout 5 --max-time 10 --fail --silent --show-error "$BASE_URL/fairbasket-contract.json" -o /tmp/published-fairbasket-contract.json; then
              if python - <<'PY'
          import json
          from pathlib import Path
          artifact = json.loads(Path("/tmp/published-fairbasket-contract.json").read_text(encoding="utf-8"))
          assert artifact.get("contractName") == "FairBasketRegistry", "wrong contract artifact"
          assert artifact.get("chainId") == 84532, "wrong target chain ID"
          assert isinstance(artifact.get("abi"), list) and artifact["abi"], "missing ABI"
          bytecode = artifact.get("bytecode", "")
          assert isinstance(bytecode, str) and bytecode.startswith("0x") and len(bytecode) > 100, "missing bytecode"
          print("Deployed FairBasket page and compiled Base Sepolia contract artifact passed smoke tests.")
          PY
              then
                READY=true
                break
              fi
            fi
            sleep 3
          done
          if [[ "$READY" != "true" ]]; then
            echo "The immutable deployment URL did not pass the FairBasket smoke test after 12 attempts." >&2
            exit 1
          fi

          # The stable/branch alias may take longer to receive the new deployment.
          # A delayed alias is reported as a warning; the immutable deployed URL above is the required check.
          if [[ -n "$ALIAS_URL" && "$ALIAS_URL" != "$BASE_URL" ]]; then
            ALIAS_READY=false
            for attempt in $(seq 1 6); do
              if curl --connect-timeout 4 --max-time 8 --fail --silent --show-error "$ALIAS_URL/fairbasket.html" -o /tmp/fairbasket-alias.html && grep -q "Spend wisely." /tmp/fairbasket-alias.html && grep -q "Deploy test registry" /tmp/fairbasket-alias.html; then
                ALIAS_READY=true
                break
              fi
              sleep 5
            done
            if [[ "$ALIAS_READY" != "true" ]]; then
              echo "::warning::The immutable deployment passed, but the stable Pages alias has not yet served the new FairBasket version: $ALIAS_URL"
            fi
          fi
