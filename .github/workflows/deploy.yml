name: Deploy Onde compro? ao Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Verificar credenciais do Cloudflare
        id: credentials
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deploy ignorado::Cadastre CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID em Settings > Secrets and variables > Actions para publicar automaticamente."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Baixar o código
        if: steps.credentials.outputs.configured == 'true'
        uses: actions/checkout@v4

      - name: Preparar arquivos estáticos
        if: steps.credentials.outputs.configured == 'true'
        shell: bash
        run: |
          mkdir -p dist
          cp index.html dist/index.html
          if [[ -d assets ]]; then
            mkdir -p dist/assets
            cp -R assets/. dist/assets/
          fi
          if [[ -d functions ]]; then
            mkdir -p dist/functions
            cp -R functions/. dist/functions/
          fi

      - name: Publicar no Cloudflare Pages
        if: steps.credentials.outputs.configured == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=onde-compro --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
