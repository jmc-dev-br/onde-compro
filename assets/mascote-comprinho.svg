<svg xmlns="http://www.w3.org/2000/svg" width="480" height="530" viewBox="0 0 480 530" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Comprinho, mascote do Onde compro?</title>
  <desc id="desc">Uma raposa laranja de óculos verdes e jaqueta verde carrega uma cesta de compras.</desc>
  <defs>
